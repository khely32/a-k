services:
  - type: web
    name: ak-web
    runtime: docker
    repo: https://github.com/khely32/a-k
    branch: main  # deploy from the branch the auto-deploy workflow fast-forwards into
    plan: free  # web services spin down after 15 min on free; upgrade to "starter" for always-on
    dockerfilePath: ./Dockerfile.render
    # Deploy on every commit that lands on the linked branch. The default
    # ("checksPass") waits for CI checks on that branch, but the auto-deploy
    # workflow pushes to main with GITHUB_TOKEN, which never triggers a CI
    # run - so the deploy would wait forever for checks that never run.
    autoDeployTrigger: commit
    # /up is registered outside the "web" middleware group, so it answers 200
    # as long as PHP is alive - even while the database is down. Pointing the
    # health check at a database-dependent path would make Render restart the
    # container every 60s instead of letting it recover on its own.
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false # set manually in dashboard; use `php artisan key:generate --show`
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require # Neon requires TLS connections
      # Neon free plan caps a project at 0.5 GB. /healthz reports usage against
      # this so a full database is visible instead of showing up as a bare 500.
      - key: DB_STORAGE_LIMIT_BYTES
        value: "536870912"
      - key: DB_HOST
        sync: false # Neon DIRECT host (no "-pooler" suffix), e.g. ep-xxxx.region.aws.neon.tech - pooler breaks migration transactions
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        sync: false # Neon database name (neondb)
      - key: DB_USERNAME
        sync: false # Neon database user
      - key: DB_PASSWORD
        sync: false # Neon password (secret)
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: SESSION_DRIVER
        value: database
      # Send Laravel's log output to stderr so it lands in the Render log
      # stream. Without this, exceptions only go to storage/logs/laravel.log
      # inside the container and the Render dashboard shows nothing useful.
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: MIGRATE_AND_SEED
        value: "true"