services:
  - type: web
    name: ak-web
    runtime: docker
    repo: https://github.com/khely32/a-k
    plan: free  # web services spin down after 15 min on free; upgrade to "starter" for always-on
    dockerfilePath: ./Dockerfile.render
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false # set manually in dashboard; use `php artisan key:generate --show`
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require # Neon requires TLS connections
      - key: DB_HOST
        sync: false # Neon host, e.g. ep-xxxx.region.aws.neon.tech
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        sync: false # Neon database name (neondb)
      - key: DB_USERNAME
        sync: false # Neon database user
      - key: DB_PASSWORD
        sync: false # Neon password (secret)
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: MIGRATE_AND_SEED
        value: "true"