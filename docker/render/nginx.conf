user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    client_max_body_size 100m;

    access_log /dev/stdout;

    server {
        listen 80;
        server_name _;
        root /var/www/html/public;
        index index.php;

        # The health endpoints are answered by the front controller directly,
        # so they keep working while the app is not ready:
        #
        #  * /healthz reports WHY the app is not serving traffic. It is
        #    registered outside the "web" middleware group, so it has no
        #    session and no database middleware and keeps answering.
        #  * /up is the path Render's health check uses. It has to answer 200
        #    while the database is down, otherwise Render considers the
        #    instance unhealthy and restarts it - a restart loop, and the
        #    reason the old start.sh ended up killing nginx mid-response.
        #
        # $request_uri is the path the client asked for and is never
        # rewritten, so Laravel still routes both paths correctly.
        location ~ ^/(healthz|up)$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
            fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param PATH_INFO $fastcgi_path_info;
        }

        # Everything else goes through the front controller.
        location / {
            try_files $uri /index.php?$query_string;
        }

        # The only executable PHP file, and the place where the ready gate
        # lives. start.sh removes the flag at boot and creates it only after
        # the database is reachable and the migrations have been applied.
        #
        # Until then every database-backed call would fail with a 500, so a
        # 503 with a Retry-After is returned instead. It has to be a complete,
        # well-formed response: a truncated one is what a browser reports as
        # ERR_INVALID_RESPONSE.
        #
        # The gate sits here (and not only in "location /") so that a direct
        # request for /index.php cannot slip past it.
        location ~ \.php$ {
            default_type text/html;

            if (!-f /var/www/html/storage/framework/ready) {
                add_header Retry-After 10 always;
                add_header Cache-Control "no-store" always;
                return 503 '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Service is starting</title></head><body style="margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;color:#e2e8f0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><main style="max-width:32rem;padding:2rem"><h1 style="margin:0 0 .75rem;font-size:1.5rem">Service is starting</h1><p style="margin:0;line-height:1.6">The application is waiting for its database. This page is complete and valid - please try again in a moment.</p></main></body></html>';
            }

            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
            fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
